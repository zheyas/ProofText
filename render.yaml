# Blueprint для Render: https://render.com/docs/blueprint-spec
databases:
  - name: prooftext-db
    databaseName: prooftext
    user: prooftext_user
    region: frankfurt
    plan: free
    ipAllowList: []  # только внутренние подключения из сервисов Render

services:
  - type: web
    name: prooftext
    runtime: docker
    dockerfilePath: ./Dockerfile
    region: frankfurt
    # free/starter = 512 МБ RAM: сайт работает, но для AI-анализа
    # (torch + RoBERTa) нужен план standard (2 ГБ)
    plan: free
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DB_NAME
        fromDatabase:
          name: prooftext-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: prooftext-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: prooftext-db
          property: password
      - key: DB_HOST
        fromDatabase:
          name: prooftext-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: prooftext-db
          property: port
      - key: SEARCH_MAX_FRAGMENTS
        value: "10"
      - key: AI_MODEL_NAME
        value: openai-community/roberta-base-openai-detector
